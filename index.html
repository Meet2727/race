<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MV — Photorealistic 3D AI System</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Three.js for 3D Hologram Stage & Post-processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand-group">
        <div class="brand-badge">MV</div>
        <div>
          <div class="brand-title-row">
            <h1>MV PHOTOREALISTIC 3D AI</h1>
            <span class="vip-pill" id="activeModelPill">DEFAULT: MODEL 1 (ROYAL GOLD)</span>
          </div>
          <p class="status-indicator">
            <span class="status-dot"></span>
            <span>Ultra-HD 3D Render Active &bull; Voice & Chat Ready</span>
          </p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="voiceToggleBtn" title="Toggle Voice">🔊</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Left: Photorealistic 3D Hologram Stage -->
      <section class="stage-panel">
        <div class="canvas-container" id="canvasContainer">
          <!-- Top HUD Viewport Switcher -->
          <div class="hud-top">
            <button class="cam-btn active" data-view="card">🖼️ Photo-Real View</button>
            <button class="cam-btn" data-view="3d">🌐 3D Hologram Mesh</button>
            <button class="cam-btn" data-view="depth">✨ 3D Depth Relief</button>
          </div>

          <!-- Bottom Model Switcher (Model 1 Default) -->
          <div class="hud-bottom">
            <button class="model-switch-btn active" id="btnModel1" data-model="1">
              <img src="assets/model-1.jpg" alt="Model 1" />
              <div>
                <strong>Model 1 (Default)</strong>
                <span>Royal Gold &bull; Detailed Portrait</span>
              </div>
            </button>
            <button class="model-switch-btn" id="btnModel2" data-model="2">
              <img src="assets/model-2.jpg" alt="Model 2" />
              <div>
                <strong>Model 2 (Shadow)</strong>
                <span>Tactical &bull; Green Eyes</span>
              </div>
            </button>
          </div>
        </div>
      </section>

      <!-- Middle: Real-Time 3D Customizer -->
      <aside class="customizer-panel">
        <h2>🎨 3D Customization</h2>
        <div class="control-group">
          <label>Lighting Glow Color</label>
          <input type="color" id="glowColorPicker" value="#d4af37" />
        </div>
        <div class="control-group">
          <label>3D Depth Relief Intensity</label>
          <input type="range" id="depthSlider" min="0.1" max="2.0" step="0.1" value="0.8" />
        </div>
        <div class="control-group">
          <label>Camera Zoom / Distance</label>
          <input type="range" id="zoomSlider" min="1.5" max="4.5" step="0.1" value="2.8" />
        </div>
        <div class="control-group">
          <label>3D Hologram Effects</label>
          <div class="toggle-grid">
            <button class="fx-btn active" data-fx="rotate">🔄 Auto Rotate</button>
            <button class="fx-btn active" data-fx="particles">✨ Sparkles</button>
          </div>
        </div>
      </aside>

      <!-- Right: AI Chat & Voice Assistant -->
      <section class="chat-panel">
        <div class="chat-messages" id="chatMessages"></div>
        <form class="chat-input-bar" id="chatForm" autocomplete="off">
          <button type="button" class="mic-btn" id="micBtn">🎙️</button>
          <input type="text" id="userInput" placeholder="MV se baat karein..." required />
          <button type="submit" class="send-btn">➤</button>
        </form>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
