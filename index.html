<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Velocity // Three.js Arcade</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-hidden font-mono select-none">

    <div id="hud" class="absolute top-4 left-4 right-4 z-10 flex justify-between pointer-events-none hidden">
        <div class="bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2 backdrop-blur-md">
            <span class="text-xs text-slate-400 uppercase block">Score</span>
            <span id="score-val" class="text-xl font-bold text-cyan-400">0</span>
        </div>
        <div class="bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2 backdrop-blur-md text-right">
            <span class="text-xs text-slate-400 uppercase block">Speed</span>
            <span id="speed-val" class="text-xl font-bold text-amber-400">0 MPH</span>
        </div>
    </div>

    <div id="menu-overlay" class="absolute inset-0 z-20 bg-slate-950/90 flex flex-col items-center justify-center p-6">
        <h1 class="text-4xl font-black bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent mb-2 tracking-tight">3D CYBER RUNNER</h1>
        <p class="text-xs text-slate-400 mb-8 max-w-sm text-center">Select your vehicle matrix blueprint and survive the incoming traffic grid.</p>
        
        <div class="grid grid-cols-3 gap-4 max-w-md w-full mb-8">
            <button id="car-0" class="car-select-btn active border-2 border-cyan-500 bg-slate-900 p-4 rounded-xl flex flex-col items-center gap-2 transition-all">
                <div class="w-12 h-6 bg-cyan-500 rounded shadow-[0_0_10px_rgba(6,182,212,0.5)]"></div>
                <span class="text-xs font-bold mt-1">Neon Sedan</span>
                <span class="text-[10px] text-slate-400">Handling: Agile</span>
            </button>
            <button id="car-1" class="car-select-btn border border-slate-800 bg-slate-900 p-4 rounded-xl flex flex-col items-center gap-2 transition-all">
                <div class="w-14 h-4 bg-amber-500 rounded-sm shadow-[0_0_10px_rgba(245,158,11,0.5)]"></div>
                <span class="text-xs font-bold mt-1">F1 Racer</span>
                <span class="text-[10px] text-slate-400">Handling: Fast</span>
            </button>
            <button id="car-2" class="car-select-btn border border-slate-800 bg-slate-900 p-4 rounded-xl flex flex-col items-center gap-2 transition-all">
                <div class="w-10 h-8 bg-purple-500 rounded-md shadow-[0_0_10px_rgba(168,85,247,0.5)]"></div>
                <span class="text-xs font-bold mt-1">Cyber Truck</span>
                <span class="text-[10px] text-slate-400">Handling: Heavy</span>
            </button>
        </div>

        <button id="start-btn" class="w-full max-w-xs py-4 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-500/20 hover:scale-105 transition-transform active:scale-95 cursor-pointer">
            ENGAGE HYPERDRIVE
        </button>
    </div>

    <div id="gameover-overlay" class="absolute inset-0 z-20 bg-slate-950/95 flex flex-col items-center justify-center p-6 hidden">
        <h2 class="text-3xl font-bold text-rose-500 mb-2 tracking-wider">CRASH DETECTED</h2>
        <p class="text-xs text-slate-400 mb-6">Structural grid integrity compromised.</p>
        
        <div class="bg-slate-900 border border-slate-800 rounded-xl px-6 py-4 mb-8 w-full max-w-xs space-y-2">
            <div class="flex justify-between text-xs text-slate-400">Final Score: <span id="final-score" class="font-bold text-slate-100">0</span></div>
        </div>

        <button id="restart-btn" class="w-full max-w-xs py-4 bg-slate-100 text-slate-950 font-bold rounded-xl shadow-lg hover:scale-105 transition-transform active:scale-95 cursor-pointer">
            REMATERIALIZE VEHICLE
        </button>
    </div>

    <div id="mobile-ctrl-left" class="absolute left-0 top-0 bottom-0 w-1/2 z-0 md:hidden"></div>
    <div id="mobile-ctrl-right" class="absolute right-0 top-0 bottom-0 w-1/2 z-0 md:hidden"></div>

    <div class="absolute bottom-4 left-0 right-0 text-center pointer-events-none text-[11px] text-slate-500 hidden md:block">
        Use <span class="bg-slate-900 px-1.5 py-0.5 border border-slate-800 rounded text-slate-400 font-mono">← / A</span> and 
        <span class="bg-slate-900 px-1.5 py-0.5 border border-slate-800 rounded text-slate-400 font-mono">→ / D</span> to switch lanes.
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
