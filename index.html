<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MV — Real 3D AI System (Default: Model 1)</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div class="brand-group">
        <div class="brand-badge">MV</div>
        <div>
          <div class="brand-title-row">
            <h1>MV 3D AI</h1>
            <span class="vip-pill" id="activeModelBadge">DEFAULT: MODEL 1 (ROYAL GOLD)</span>
          </div>
          <p class="status-indicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Real 3D Engine Ready &bull; Model 1 Active</span>
          </p>
        </div>
      </div>

      <div class="header-actions">
        <label class="upload-glb-btn" title="Upload Custom .GLB 3D File">
          📦 Load .GLB
          <input type="file" id="glbUploadInput" accept=".glb,.gltf" hidden />
        </label>
        <button class="icon-btn" id="voiceToggleBtn" title="Toggle Voice">🔊</button>
      </div>
    </header>

    <main class="workspace">
      <!-- Left: 3D Full-Body Viewport -->
      <section class="stage-panel">
        <div id="canvasContainer" class="canvas-container">
          <div class="hud-top">
            <button class="cam-btn active" data-cam="full">Full Body</button>
            <button class="cam-btn" data-cam="upper">Upper Body</button>
            <button class="cam-btn" data-cam="face">Close-Up Face</button>
          </div>

          <div class="hud-bottom">
            <button class="model-switch-btn active" id="btnModel1" data-model="1">
              <img src="assets/mv-avatar-1.jpg" alt="Model 1" />
              <span>Model 1 (Default)</span>
            </button>
            <button class="model-switch-btn" id="btnModel2" data-model="2">
              <img src="assets/mv-avatar-2.jpg" alt="Model 2" />
              <span>Model 2 (Shadow)</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Middle: Real-Time 3D Customizer -->
      <aside class="customizer-panel">
        <h2>3D Model Customizer</h2>

        <div class="control-group">
          <label>Outfit / Armor Tint</label>
          <input type="color" id="armorColorPicker" value="#d4af37" />
        </div>

        <div class="control-group">
          <label>Hair Color Tint</label>
          <input type="color" id="hairColorPicker" value="#e6ccb2" />
        </div>

        <div class="control-group">
          <label>Eye / Core Glow</label>
          <input type="color" id="glowColorPicker" value="#ff2a55" />
        </div>

        <div class="control-group">
          <label>3D Body Scale</label>
          <input type="range" id="scaleSlider" min="0.85" max="1.2" step="0.01" value="1" />
        </div>

        <div class="control-group">
          <label>Lighting Intensity</label>
          <input type="range" id="lightSlider" min="0.5" max="2.5" step="0.1" value="1.4" />
        </div>

        <div class="control-group">
          <label>3D Accessories</label>
          <div class="toggle-grid">
            <button class="acc-btn active" data-part="crown">👑 Crown</button>
            <button class="acc-btn active" data-part="wings">🪽 Wings</button>
            <button class="acc-btn active" data-part="weapon">⚔️ Blade</button>
            <button class="acc-btn active" data-part="aura">✨ Aura Ring</button>
          </div>
        </div>

        <div class="control-group">
          <label>3D Animations</label>
          <div class="toggle-grid">
            <button class="anim-btn active" data-anim="idle">Idle</button>
            <button class="anim-btn" data-anim="wave">Wave</button>
            <button class="anim-btn" data-anim="combat">Combat</button>
            <button class="anim-btn" data-anim="spin">360° Spin</button>
          </div>
        </div>
      </aside>

      <!-- Right: AI Chat Interaction -->
      <section class="chat-panel">
        <div class="chat-messages" id="chatMessages"></div>
        <form class="chat-input-bar" id="chatForm" autocomplete="off">
          <button type="button" class="mic-btn" id="micBtn">🎙️</button>
          <input type="text" id="userInput" placeholder="MV se baat karein ya command dein..." required />
          <button type="submit" class="send-btn">➤</button>
        </form>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
